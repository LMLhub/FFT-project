fs:
  id: fs
  name: Positive fractal signs
  description: Give preference to the gamble with the most fractals that leads to
    an increase in wealth
  type: boolean
  threshold: 0
  params: {}
  feature_name: signs
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
