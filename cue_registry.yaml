pri_1_50_a:
  id: pri_1_50_a
  name: Minimum gains difference 50 percent (additive)
  description: Give preference to the gamble with the highest minimum gains if the
    minimum gains differs by 50 percent of the maximum gain
  type: boolean
  threshold: 0
  params:
    tol: 0.5
    dynamic: additive
  feature_name: priority_step1
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
