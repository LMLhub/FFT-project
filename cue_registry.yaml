gr:
  id: gr
  name: Maximising time-average growth rate
  description: This cue compares the growth rates of the gambles and picks the side
    with the highest time-average growth rate. Works for both additive and multiplicative
    dynamics.
  type: numerical
  threshold: 0
  params: {}
  feature_name: growth_rate
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
gr_min:
  id: gr_min
  name: Minimising time-average growth rate
  description: This cue compares the growth rates of the gambles and picks the side
    with the lowest time-average growth rate. Works for both additive and multiplicative
    dynamics.
  type: numerical
  threshold: 0
  params: {}
  feature_name: growth_rate_min
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
eu_1_5_a:
  id: eu_1_5_a
  name: Expected Isoelastic Utility - eta=1.5, additive
  description: This cue that evaluates the expected isoelastic utility of the first
    gamble with eta=1.5 and picks a side if the cue value is greater than 2.
  type: numerical
  threshold: 0
  params:
    dynamic: additive
    eta: 1.5
  feature_name: expected_isoelastic_utility
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
  - wealth
eu_1_5_m:
  id: eu_1_5_m
  name: Expected Isoelastic Utility - eta=1.5, multiplicative
  description: This cue that evaluates the expected isoelastic utility of the first
    gamble with eta=1.5 and picks a side if the cue value is greater than 2.
  type: numerical
  threshold: 0
  params:
    dynamic: multiplicative
    eta: 1.5
  feature_name: expected_isoelastic_utility
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
  - wealth
aw_1_a:
  id: aw_1_a
  name: Avoid worst 1 of all - additive
  description: Prefers the gamble that does not contain the worst fractal value.
  type: boolean
  threshold: 0
  params:
    n: 1
    fractal_values: &id001
    - -407.0
    - -305.5
    - -241.0
    - -144.5
    - -49.0
    - 108.5
    - 210.0
    - 309.5
    - 440.0
  feature_name: avoid_worst_n_ranks
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
aw_1_m:
  id: aw_1_m
  name: Avoid worst 1 of all - multiplicative
  description: Prefers the gamble that does not contain the worst fractal value.
  type: boolean
  threshold: 0
  params:
    n: 1
    fractal_values: &id002
    - -0.8500000000000001
    - -0.5395000000000001
    - -0.4330000000000001
    - -0.1735
    - 0.006
    - 0.1685
    - 0.369
    - 0.5535
    - 0.772
  feature_name: avoid_worst_n_ranks
  required arguments:
  - gamma_left_up
  - gamma_left_down
  - gamma_right_up
  - gamma_right_down
aw_2_a:
  id: aw_2_a
  name: Avoid worst 2 of all - additive
  description: Prefers the gamble that does not contain the two worst fractal values.
  type: boolean
  threshold: 0
  params:
