site_name: FFT Project
site_url: https://<user>.github.io/<repo>/

theme:
  name: material

docs_dir: docs

nav:
  - Home: index.md
  - Documentation:
      - Overview: docs/index.md
      - Class Documentation: docs/class_documentation.md
      - Eta Estimation: docs/eta-estimation.md
      - Naming Conventions: docs/naming_conventions.md
      - Reference Paper (PDF): docs/Ergodicity_transformations_predict_human_decision_making_under_risk-3.pdf
  - Notes:
      - Overview: notes/index.md
      - Accuracy Measures: notes/accuracy.md
      - Greedy FFT Construction Notes: notes/greedy.md
      - Priority heuristic: notes/priority.md


markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.highlight

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
