pri_a:
  id: pri_a
  name: Priority heuristic
  description: "The priority heuristic as described by Brandst\xE4tter, Gigerenzer,\
    \ and Hertwig (2006). For additive dynamics"
  cues:
  - id: pri_1_50_a
    name: Minimum gains difference 50 percent (additive)
  - id: pri_3_a
    name: Maximum gains (additive)
  tree length: 2
pri_m:
  id: pri_m
  name: Priority heuristic
  description: "The priority heuristic as described by Brandst\xE4tter, Gigerenzer,\
    \ and Hertwig (2006) but with different tolerance. For multiplicative dynamics"
  cues:
  - id: pri_1_35_m
    name: Minimum gains difference 35 percent (multiplicative)
  - id: pri_3_m
    name: Maximum gains (multiplicative)
  tree length: 2
pri_nl_a:
  id: pri_nl_a
  name: Priority heuristic (no loss)
  description: "The priority heuristic as described by Brandst\xE4tter, Gigerenzer,\
    \ and Hertwig (2006) without the loss option and with different tolerance. For\
    \ additive dynamics"
  cues:
  - id: pri_nl_1_40_a
    name: Variation No Loss of priority heuristic step 1 with 40 percent tolerance(additive)
  - id: pri_nl_3_a
    name: Variation No Loss of step 3 of the priority heuristic (additive)
  tree length: 2
pri_nl_m:
  id: pri_nl_m
